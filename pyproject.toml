[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stint"
version = "0.8.0"
description = "Declarative schema-as-code and ORM for work-management systems. Jira first, dialect protocol for the rest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Curtis Turner" }]
keywords = [
  "jira",
  "orm",
  "migrations",
  "alembic",
  "schema-as-code",
  "atlassian",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "httpx2>=2.14",
  "pyyaml>=6.0",
  "cyclopts>=4.0",
]

[project.urls]
Homepage = "https://github.com/curtis-turner/stint"
Source = "https://github.com/curtis-turner/stint"
Issues = "https://github.com/curtis-turner/stint/issues"
Changelog = "https://github.com/curtis-turner/stint/blob/main/CHANGELOG.md"

[project.scripts]
stint = "stint.cli:main"

[tool.setuptools.packages.find]
include = ["stint*"]

[tool.setuptools.package-data]
stint = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.21",
  "pytest-cov>=4.0",
  # Older respx lacks the mocker-registry shape the pytest-httpx2 bridge
  # relies on (verified: 0.21.1 fails 236 tests under the bridge; 0.23.1
  # passes). Bump the floor in lockstep with respx's next httpx2-native
  # release when the conftest bridge is retired.
  "respx>=0.23.1",
  "pytest-httpx2>=1.0",
  "ruff>=0.15.14",
  "types-PyYAML>=6.0",
  # 0.0.99 regressed TypeVar-with-forward-ref-bound inference
  # (stint/query/sync.py `AsyncSession.get` arg reported as `Never`);
  # unpin once a ty release fixes it.
  "ty>=0.0.55,<0.0.99",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
